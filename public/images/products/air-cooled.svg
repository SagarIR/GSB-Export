<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="acheSteelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#356B98" />
      <stop offset="50%" stop-color="#234D70" />
      <stop offset="100%" stop-color="#10263D" />
    </linearGradient>
    <pattern id="acheGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8DEE5" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Engineering Background -->
  <rect width="800" height="500" fill="#F3F5F7" />
  <rect width="800" height="500" fill="url(#acheGrid)" />

  <rect x="20" y="20" width="760" height="460" stroke="#D8DEE5" stroke-width="1.5" rx="6" />
  <text x="40" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10263D" letter-spacing="1.5">
    AIR-COOLED HEAT EXCHANGER (ACHE / FIN-FAN COOLER)
  </text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#234D70">
    API 661 Forced Draft Finned Tube Bundle with Dual Axial Fan Bays
  </text>

  <!-- Fin-Fan Architecture Assembly -->
  <g transform="translate(100, 100)">
    <!-- Structural Steel Framework / Legs -->
    <path d="M 40 180 L 20 300 L 45 300 L 60 180 Z" fill="#202A35" />
    <path d="M 560 180 L 540 300 L 565 300 L 580 180 Z" fill="#202A35" />
    <path d="M 300 180 L 290 300 L 310 300 L 320 180 Z" fill="#202A35" />
    
    <!-- Cross Bracing Structural Steel -->
    <line x1="45" y1="200" x2="300" y2="280" stroke="#10263D" stroke-width="3" />
    <line x1="45" y1="280" x2="300" y2="200" stroke="#10263D" stroke-width="3" />
    <line x1="305" y1="200" x2="560" y2="280" stroke="#10263D" stroke-width="3" />
    <line x1="305" y1="280" x2="560" y2="200" stroke="#10263D" stroke-width="3" />
    <rect x="20" y="175" width="560" height="12" fill="#10263D" />

    <!-- Two Axial Fan Assemblies (Forced Draft - Bottom) -->
    <!-- Fan 1 (Left Bay) -->
    <g transform="translate(80, 130)">
      <rect x="20" y="30" width="160" height="25" fill="#234D70" rx="3" />
      <circle cx="100" cy="42" r="22" fill="#D88B35" stroke="#10263D" stroke-width="2" />
      <!-- Fan Blades -->
      <line x1="40" y1="42" x2="160" y2="42" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <line x1="65" y1="20" x2="135" y2="64" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <line x1="65" y1="64" x2="135" y2="20" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <!-- Electric Motor Drive -->
      <rect x="85" y="65" width="30" height="40" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="3" />
    </g>

    <!-- Fan 2 (Right Bay) -->
    <g transform="translate(340, 130)">
      <rect x="20" y="30" width="160" height="25" fill="#234D70" rx="3" />
      <circle cx="100" cy="42" r="22" fill="#D88B35" stroke="#10263D" stroke-width="2" />
      <line x1="40" y1="42" x2="160" y2="42" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <line x1="65" y1="20" x2="135" y2="64" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <line x1="65" y1="64" x2="135" y2="20" stroke="#10263D" stroke-width="4" stroke-linecap="round" />
      <rect x="85" y="65" width="30" height="40" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="3" />
    </g>

    <!-- Finned Tube Bundle (Upper Horizontal Section) -->
    <rect x="30" y="20" width="540" height="90" fill="url(#acheSteelGrad)" stroke="#10263D" stroke-width="2" rx="4" />

    <!-- Left Header Box (Plug Type) -->
    <rect x="20" y="10" width="32" height="110" fill="#10263D" stroke="#D88B35" stroke-width="1.5" rx="3" />
    <!-- Process Inlet Nozzle -->
    <rect x="2" y="35" width="22" height="24" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="-6" y="31" width="8" height="32" fill="#10263D" rx="2" />
    <path d="M -25 47 L -8 47 M -15 42 L -8 47 L -15 52" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="-70" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">INLET</text>

    <!-- Right Header Box -->
    <rect x="548" y="10" width="32" height="110" fill="#10263D" stroke="#D88B35" stroke-width="1.5" rx="3" />
    <!-- Process Outlet Nozzle -->
    <rect x="576" y="65" width="22" height="24" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="598" y="61" width="8" height="32" fill="#10263D" rx="2" />
    <path d="M 610 77 L 625 77 M 618 72 L 625 77 L 618 82" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="632" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">OUTLET</text>

    <!-- Finned Tubes Visible in Cutaway -->
    <g transform="translate(60, 30)">
      <!-- Finned Tube Rows -->
      <line x1="0" y1="15" x2="480" y2="15" stroke="#D8DEE5" stroke-width="8" stroke-dasharray="2 3" />
      <line x1="0" y1="35" x2="480" y2="35" stroke="#D8DEE5" stroke-width="8" stroke-dasharray="2 3" />
      <line x1="0" y1="55" x2="480" y2="55" stroke="#D8DEE5" stroke-width="8" stroke-dasharray="2 3" />
    </g>

    <!-- Airflow Direction Arrows (Forced Upwards) -->
    <g stroke="#D88B35" stroke-width="2" stroke-linecap="round">
      <path d="M 170 120 L 170 8 M 165 16 L 170 8 L 175 16" />
      <path d="M 190 120 L 190 8 M 185 16 L 190 8 L 195 16" />
      <path d="M 430 120 L 430 8 M 425 16 L 430 8 L 435 16" />
      <path d="M 450 120 L 450 8 M 445 16 L 450 8 L 455 16" />
    </g>
    <text x="210" y="-5" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#234D70">AMBIENT AIR FLOW (ZERO WATER DEMAND)</text>
  </g>

  <!-- Technical Standards Badge -->
  <rect x="620" y="430" width="140" height="30" fill="#10263D" rx="4" />
  <text x="690" y="450" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D88B35" text-anchor="middle">
    API 661 / ISO 13706
  </text>
</svg>

