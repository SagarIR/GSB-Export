<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#10263D" />
  <g transform="translate(60, 40)">
    <!-- Steam Turbine Housing -->
    <path d="M 60 120 L 140 100 L 140 220 L 60 200 Z" fill="#163248" stroke="#D8DEE5" stroke-width="2" />
    <circle cx="100" cy="160" r="25" fill="#234D70" stroke="#D88B35" stroke-width="2" />
    <line x1="85" y1="160" x2="115" y2="160" stroke="#FFFFFF" stroke-width="2" />
    <line x1="100" y1="145" x2="100" y2="175" stroke="#FFFFFF" stroke-width="2" />

    <!-- Generator Core -->
    <rect x="155" y="115" width="80" height="90" fill="#163248" stroke="#234D70" stroke-width="2" rx="4" />
    <line x1="140" y1="160" x2="155" y2="160" stroke="#D88B35" stroke-width="5" />

    <!-- Massive Surface Condenser Below Turbine -->
    <rect x="50" y="240" width="160" height="60" rx="10" fill="#234D70" stroke="#D8DEE5" stroke-width="2" />
    <line x1="50" y1="210" x2="50" y2="240" stroke="#D88B35" stroke-width="4" />
    <line x1="130" y1="210" x2="130" y2="240" stroke="#D88B35" stroke-width="4" />

    <!-- Air Cooled Condenser Fan Bank on Right -->
    <g transform="translate(280, 100)">
      <polygon points="30,120 70,40 170,40 210,120" fill="#163248" stroke="#234D70" stroke-width="2" />
      <circle cx="95" cy="80" r="18" fill="#234D70" stroke="#D88B35" stroke-width="2" />
      <circle cx="145" cy="80" r="18" fill="#234D70" stroke="#D88B35" stroke-width="2" />
    </g>
  </g>
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Power Generation &amp; Thermal Utilities</text>
  <text x="50" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#D88B35">Surface Condensers, Feedwater Preheaters &amp; Turbine Cooling</text>
</svg>
