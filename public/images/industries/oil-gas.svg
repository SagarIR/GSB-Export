<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#10263D" />
  <g transform="translate(60, 40)">
    <!-- Distillation Towers -->
    <rect x="80" y="40" width="70" height="280" rx="20" fill="#163248" stroke="#234D70" stroke-width="2" />
    <line x1="80" y1="100" x2="150" y2="100" stroke="#234D70" stroke-width="1.5" />
    <line x1="80" y1="160" x2="150" y2="160" stroke="#234D70" stroke-width="1.5" />
    <line x1="80" y1="220" x2="150" y2="220" stroke="#234D70" stroke-width="1.5" />
    <line x1="80" y1="280" x2="150" y2="280" stroke="#234D70" stroke-width="1.5" />
    
    <!-- Spherical LPG Storage Vessel -->
    <circle cx="270" cy="220" r="60" fill="#163248" stroke="#D8DEE5" stroke-width="2" />
    <line x1="220" y1="280" x2="220" y2="320" stroke="#202A35" stroke-width="4" />
    <line x1="320" y1="280" x2="320" y2="320" stroke="#202A35" stroke-width="4" />
    
    <!-- Heavy Duty Exchanger Shell -->
    <rect x="360" y="160" width="110" height="45" rx="8" fill="#234D70" stroke="#D88B35" stroke-width="2" />
    <rect x="355" y="152" width="10" height="60" fill="#D88B35" rx="2" />
    <rect x="465" y="152" width="10" height="60" fill="#D88B35" rx="2" />

    <!-- Piping -->
    <path d="M 150 80 L 380 80 L 380 160" stroke="#D88B35" stroke-width="3" fill="none" />
    <path d="M 410 205 L 410 270 L 320 270" stroke="#D8DEE5" stroke-width="3" fill="none" stroke-dasharray="4 4" />
  </g>
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Oil, Gas &amp; Petrochemical Refining</text>
  <text x="50" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#D88B35">High-Pressure Distillation &amp; Hydrocarbon Processing</text>
</svg>

