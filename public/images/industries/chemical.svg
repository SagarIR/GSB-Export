<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#10263D" />
  <g transform="translate(60, 40)">
    <!-- Continuous Chemical Reactor Vessel -->
    <rect x="80" y="80" width="120" height="180" rx="24" fill="#163248" stroke="#D88B35" stroke-width="2.5" />
    <circle cx="140" cy="170" r="35" fill="none" stroke="#234D70" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Agitator Motor on Top -->
    <rect x="125" y="45" width="30" height="35" fill="#D8DEE5" rx="3" />
    <line x1="140" y1="80" x2="140" y2="200" stroke="#D88B35" stroke-width="3" />

    <!-- External Plate Heat Exchanger Module -->
    <rect x="280" y="90" width="80" height="150" fill="#234D70" stroke="#D8DEE5" stroke-width="2" rx="4" />
    <!-- Plate pack lines -->
    <line x1="290" y1="110" x2="350" y2="110" stroke="#D88B35" stroke-width="1.5" />
    <line x1="290" y1="130" x2="350" y2="130" stroke="#D8DEE5" stroke-width="1.5" />
    <line x1="290" y1="150" x2="350" y2="150" stroke="#D88B35" stroke-width="1.5" />
    <line x1="290" y1="170" x2="350" y2="170" stroke="#D8DEE5" stroke-width="1.5" />
    <line x1="290" y1="190" x2="350" y2="190" stroke="#D88B35" stroke-width="1.5" />
    <line x1="290" y1="210" x2="350" y2="210" stroke="#D8DEE5" stroke-width="1.5" />

    <!-- Closed loop circulation lines -->
    <path d="M 200 120 L 280 120" stroke="#D88B35" stroke-width="3" fill="none" />
    <path d="M 280 200 L 200 200" stroke="#234D70" stroke-width="3" fill="none" />
    <polygon points="230,196 220,200 230,204" fill="#234D70" />
    <polygon points="250,116 260,120 250,124" fill="#D88B35" />
  </g>
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Chemical &amp; Petrochemical Synthesis</text>
  <text x="50" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#D88B35">Exotic Alloy Corrosion Containment &amp; Reaction Heating</text>
</svg>
