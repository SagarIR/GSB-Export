<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hexagonal Outer Border -->
  <polygon points="32,2 60,18 60,46 32,62 4,46 4,18" fill="#10263D" stroke="#D88B35" stroke-width="3" />
  
  <!-- Hot Stream (Copper Flow) -->
  <path d="M14,24 C24,22 26,34 36,32 C46,30 48,40 50,38" stroke="#D88B35" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polygon points="47,34 53,38 47,42" fill="#D88B35" />

  <!-- Cold Stream (Silver / Steel Flow) -->
  <path d="M50,44 C40,46 38,34 28,36 C18,38 16,28 14,30" stroke="#D8DEE5" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <polygon points="17,34 11,30 17,26" fill="#D8DEE5" />

  <!-- Center divider -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#234D70" stroke-width="2" stroke-dasharray="2 2" />
</svg>
