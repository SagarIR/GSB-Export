<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dpPipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234D70" />
      <stop offset="50%" stop-color="#10263D" />
      <stop offset="100%" stop-color="#0B1A2A" />
    </linearGradient>
    <linearGradient id="dpInnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4A053" />
      <stop offset="50%" stop-color="#D88B35" />
      <stop offset="100%" stop-color="#B86F21" />
    </linearGradient>
    <pattern id="dpGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8DEE5" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Engineering Background -->
  <rect width="800" height="500" fill="#F3F5F7" />
  <rect width="800" height="500" fill="url(#dpGrid)" />

  <rect x="20" y="20" width="760" height="460" stroke="#D8DEE5" stroke-width="1.5" rx="6" />
  <text x="40" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10263D" letter-spacing="1.5">
    DOUBLE PIPE / HAIRPIN HEAT EXCHANGER SCHEMATIC
  </text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#234D70">
    Pure Counter-Current Annular Flow with Free-Floating Return Bend
  </text>

  <!-- Hairpin Double Pipe Assembly -->
  <g transform="translate(120, 110)">
    <!-- Support Saddles / Legs -->
    <path d="M 120 230 L 105 285 L 155 285 L 140 230 Z" fill="#202A35" />
    <rect x="95" y="280" width="70" height="10" fill="#10263D" rx="2" />
    <path d="M 380 230 L 365 285 L 415 285 L 400 230 Z" fill="#202A35" />
    <rect x="355" y="280" width="70" height="10" fill="#10263D" rx="2" />

    <!-- Top Outer Pipe (Shell / Annulus) -->
    <rect x="60" y="40" width="380" height="50" fill="url(#dpPipeGrad)" stroke="#10263D" stroke-width="2" rx="4" />
    <!-- Cutaway window on top pipe showing inner finned tube -->
    <rect x="120" y="48" width="260" height="34" fill="#0E1E2E" stroke="#234D70" stroke-width="1.5" />
    <!-- Inner Tube running through top pipe -->
    <rect x="40" y="58" width="420" height="14" fill="url(#dpInnerGrad)" stroke="#10263D" stroke-width="1" />
    <!-- Longitudinal Fins on Inner Tube -->
    <line x1="120" y1="55" x2="380" y2="55" stroke="#D8DEE5" stroke-width="3" stroke-dasharray="8 4" />
    <line x1="120" y1="75" x2="380" y2="75" stroke="#D8DEE5" stroke-width="3" stroke-dasharray="8 4" />

    <!-- Bottom Outer Pipe (Shell / Annulus) -->
    <rect x="60" y="160" width="380" height="50" fill="url(#dpPipeGrad)" stroke="#10263D" stroke-width="2" rx="4" />
    <!-- Cutaway window on bottom pipe -->
    <rect x="120" y="168" width="260" height="34" fill="#0E1E2E" stroke="#234D70" stroke-width="1.5" />
    <!-- Inner Tube running through bottom pipe -->
    <rect x="40" y="178" width="420" height="14" fill="url(#dpInnerGrad)" stroke="#10263D" stroke-width="1" />
    <!-- Longitudinal Fins on Bottom Inner Tube -->
    <line x1="120" y1="175" x2="380" y2="175" stroke="#D8DEE5" stroke-width="3" stroke-dasharray="8 4" />
    <line x1="120" y1="195" x2="380" y2="195" stroke="#D8DEE5" stroke-width="3" stroke-dasharray="8 4" />

    <!-- 180° Return Hairpin Bend (Right End) -->
    <!-- Outer Shell Return Flanges & Connection -->
    <path d="M 440 65 C 490 65 490 185 440 185" fill="none" stroke="url(#dpPipeGrad)" stroke-width="36" />
    <path d="M 440 65 C 490 65 490 185 440 185" fill="none" stroke="#10263D" stroke-width="2" />
    <!-- Inner Tube Return U-Bend -->
    <path d="M 450 65 C 480 65 480 185 450 185" fill="none" stroke="url(#dpInnerGrad)" stroke-width="14" />

    <!-- Terminal Head Flanges (Left End) -->
    <!-- Top Inner Pipe Flange -->
    <rect x="25" y="48" width="16" height="34" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="2" />
    <!-- Bottom Inner Pipe Flange -->
    <rect x="25" y="168" width="16" height="34" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="2" />

    <!-- Annular Fluid Inlets / Outlets (Shell Connections) -->
    <!-- Top Shell Nozzle -->
    <rect x="80" y="5" width="28" height="35" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="70" y="0" width="48" height="7" fill="#10263D" rx="2" />
    <path d="M 94 -12 L 94 -1 M 89 -6 L 94 -1 L 99 -6" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="105" y="-5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">ANNULUS IN</text>

    <!-- Bottom Shell Nozzle -->
    <rect x="80" y="210" width="28" height="35" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="70" y="243" width="48" height="7" fill="#10263D" rx="2" />
    <path d="M 94 260 L 94 270 M 89 265 L 94 270 L 99 265" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="105" y="268" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">ANNULUS OUT</text>

    <!-- Tube Fluid Connection Arrows -->
    <path d="M 0 65 L 20 65 M 12 60 L 20 65 L 12 70" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="-70" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">TUBE IN</text>

    <path d="M 20 185 L 0 185 M 8 180 L 0 185 L 8 190" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="-80" y="188" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">TUBE OUT</text>
  </g>

  <!-- Technical Code Badge -->
  <rect x="620" y="430" width="140" height="30" fill="#10263D" rx="4" />
  <text x="690" y="450" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D88B35" text-anchor="middle">
    ASME SEC VIII / B31.3
  </text>
</svg>

