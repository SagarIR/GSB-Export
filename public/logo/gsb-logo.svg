<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- GSB Thermal Hex Core Emblem -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Outer Border -->
    <polygon points="30,2 58,18 58,50 30,66 2,50 2,18" fill="#10263D" stroke="#D88B35" stroke-width="2.5" />
    
    <!-- Thermal Exchange Flow Paths (Hot Stream / Cold Stream) -->
    <!-- Hot Stream (Copper Accent Flow) -->
    <path d="M12,22 C22,20 24,32 34,30 C44,28 46,38 48,36" stroke="#D88B35" stroke-width="3" stroke-linecap="round" fill="none" />
    <polygon points="46,32 52,36 46,40" fill="#D88B35" />

    <!-- Cold Stream (Steel Flow) -->
    <path d="M48,46 C38,48 36,36 26,38 C16,40 14,30 12,32" stroke="#D8DEE5" stroke-width="3" stroke-linecap="round" fill="none" />
    <polygon points="14,36 8,32 14,28" fill="#D8DEE5" />

    <!-- Central Core Division Line -->
    <line x1="30" y1="12" x2="30" y2="56" stroke="#234D70" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Typography: GSB EXPORT -->
  <text x="80" y="44" font-family="'Plus Jakarta Sans', 'Manrope', 'Segoe UI', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#10263D">
    GSB <tspan fill="#D88B35">EXPORT</tspan>
  </text>
  <text x="82" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9" letter-spacing="3.2" fill="#234D70" text-transform="uppercase">
    Industrial Heat Exchanger Solutions
  </text>
</svg>
