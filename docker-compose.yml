version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gsb_export_db
    restart: always
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gsb_export
    ports:
      - "5432:5432"
    volumes:
      - gsb_postgres_data:/var/lib/postgresql/data

volumes:
  gsb_postgres_data:
    driver: local
