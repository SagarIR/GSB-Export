<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#10263D" />
  <g transform="translate(60, 40)">
    <!-- Hygienic Stainless Storage Silo -->
    <rect x="60" y="80" width="100" height="180" rx="12" fill="#163248" stroke="#D8DEE5" stroke-width="2.5" />
    <path d="M 60 80 C 60 50 160 50 160 80 Z" fill="#234D70" stroke="#D8DEE5" stroke-width="2" />
    <polygon points="60,260 160,260 110,310" fill="#163248" stroke="#D8DEE5" stroke-width="2" />

    <!-- Multi-Section Sanitary Plate Pasteurizer Unit -->
    <g transform="translate(240, 80)">
      <rect x="0" y="0" width="180" height="180" rx="8" fill="#163248" stroke="#234D70" stroke-width="2" />
      <!-- Multi section dividers -->
      <rect x="15" y="15" width="40" height="150" fill="#234D70" stroke="#D88B35" stroke-width="1.5" />
      <rect x="65" y="15" width="45" height="150" fill="#234D70" stroke="#D8DEE5" stroke-width="1.5" />
      <rect x="120" y="15" width="45" height="150" fill="#234D70" stroke="#D88B35" stroke-width="1.5" />
      
      <!-- Food Grade Tri-Clamp Ports -->
      <circle cx="35" cy="40" r="8" fill="#D88B35" />
      <circle cx="35" cy="140" r="8" fill="#234D70" />
      <circle cx="140" cy="40" r="8" fill="#D8DEE5" />
      <circle cx="140" cy="140" r="8" fill="#D88B35" />
    </g>

    <path d="M 110 310 L 110 330 L 260 330 L 260 260" stroke="#D88B35" stroke-width="2.5" fill="none" />
  </g>
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Food, Beverage &amp; Dairy Processing</text>
  <text x="50" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#D88B35">Sanitary 3-A Standards &amp; High-Efficiency Heat Recovery</text>
</svg>
