<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="stShellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234D70" />
      <stop offset="50%" stop-color="#10263D" />
      <stop offset="100%" stop-color="#0B1A2A" />
    </linearGradient>
    <linearGradient id="stTubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8DEE5" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BDC7D2" />
    </linearGradient>
    <linearGradient id="stCopperFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D88B35" />
      <stop offset="100%" stop-color="#E4A053" />
    </linearGradient>
    <pattern id="stGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8DEE5" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Engineering Background -->
  <rect width="800" height="500" fill="#F3F5F7" />
  <rect width="800" height="500" fill="url(#stGrid)" />

  <!-- Technical Border Frame -->
  <rect x="20" y="20" width="760" height="460" stroke="#D8DEE5" stroke-width="1.5" rx="6" />
  <text x="40" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10263D" letter-spacing="1.5">
    TEMA TYPE E / AES — SHELL &amp; TUBE HEAT EXCHANGER SCHEMATIC
  </text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#234D70">
    Fixed Tubesheet &amp; Removable Bundle Architecture
  </text>

  <!-- Outer Shell Body (Cutaway Section) -->
  <g transform="translate(100, 110)">
    <!-- Support Saddles -->
    <path d="M 120 220 L 105 280 L 155 280 L 140 220 Z" fill="#202A35" />
    <rect x="95" y="275" width="70" height="10" fill="#10263D" rx="2" />
    
    <path d="M 480 220 L 465 280 L 515 280 L 500 220 Z" fill="#202A35" />
    <rect x="455" y="275" width="70" height="10" fill="#10263D" rx="2" />

    <!-- Channel Head (Stationary End - Left) -->
    <path d="M 30 50 C 0 50 0 190 30 190 L 80 190 L 80 50 Z" fill="url(#stShellGrad)" stroke="#10263D" stroke-width="2" />
    <!-- Channel Flange -->
    <rect x="75" y="42" width="16" height="156" fill="#234D70" stroke="#10263D" stroke-width="1.5" rx="3" />
    
    <!-- Channel Nozzles (Tube Side Inlet / Outlet) -->
    <rect x="25" y="5" width="30" height="45" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="15" y="0" width="50" height="8" fill="#10263D" rx="2" />
    <!-- Tube Inlet Arrow -->
    <path d="M 40 -15 L 40 -2 M 35 -7 L 40 -2 L 45 -7" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="-8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">TUBE INLET</text>

    <!-- Main Shell Vessel Body -->
    <rect x="90" y="50" width="440" height="140" fill="url(#stShellGrad)" stroke="#10263D" stroke-width="2" rx="4" />
    
    <!-- Cutaway Window to Reveal Tubes & Baffles -->
    <rect x="110" y="65" width="400" height="110" fill="#0E1E2E" stroke="#234D70" stroke-width="1.5" rx="3" />
    
    <!-- Segmental Baffles (Alternating Up & Down) -->
    <rect x="170" y="65" width="6" height="80" fill="#D88B35" />
    <rect x="240" y="95" width="6" height="80" fill="#D88B35" />
    <rect x="310" y="65" width="6" height="80" fill="#D88B35" />
    <rect x="380" y="95" width="6" height="80" fill="#D88B35" />
    <rect x="450" y="65" width="6" height="80" fill="#D88B35" />

    <!-- Tube Bundle (Parallel Seamless Heat Exchange Tubes) -->
    <line x1="90" y1="80" x2="510" y2="80" stroke="url(#stTubeGrad)" stroke-width="5" />
    <line x1="90" y1="95" x2="510" y2="95" stroke="url(#stTubeGrad)" stroke-width="5" />
    <line x1="90" y1="110" x2="510" y2="110" stroke="url(#stTubeGrad)" stroke-width="5" />
    <line x1="90" y1="125" x2="510" y2="125" stroke="url(#stTubeGrad)" stroke-width="5" />
    <line x1="90" y1="140" x2="510" y2="140" stroke="url(#stTubeGrad)" stroke-width="5" />
    <line x1="90" y1="155" x2="510" y2="155" stroke="url(#stTubeGrad)" stroke-width="5" />

    <!-- Shell Side Nozzles (Inlet & Outlet) -->
    <!-- Shell Inlet Nozzle (Top) -->
    <rect x="180" y="10" width="36" height="40" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="170" y="5" width="56" height="8" fill="#10263D" rx="2" />
    <path d="M 198 -10 L 198 0 M 193 -5 L 198 0 L 203 -5" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="210" y="-4" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">SHELL INLET</text>

    <!-- Shell Outlet Nozzle (Bottom) -->
    <rect x="430" y="190" width="36" height="40" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="420" y="225" width="56" height="8" fill="#10263D" rx="2" />
    <path d="M 448 245 L 448 255 M 443 250 L 448 255 L 453 250" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="460" y="252" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">SHELL OUTLET</text>

    <!-- Rear Head / Floating Head Flange (Right End) -->
    <rect x="525" y="42" width="16" height="156" fill="#234D70" stroke="#10263D" stroke-width="1.5" rx="3" />
    <path d="M 540 50 C 570 50 570 190 540 190 Z" fill="url(#stShellGrad)" stroke="#10263D" stroke-width="2" />

    <!-- Technical Annotations -->
    <g transform="translate(40, 240)">
      <circle cx="10" cy="10" r="4" fill="#D88B35" />
      <text x="22" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Stationary Tubesheet</text>
      
      <circle cx="160" cy="10" r="4" fill="#D88B35" />
      <text x="172" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Segmental Baffles</text>
      
      <circle cx="310" cy="10" r="4" fill="#D8DEE5" />
      <text x="322" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Heavy-Wall Pressure Shell</text>
      
      <circle cx="480" cy="10" r="4" fill="#234D70" />
      <text x="492" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Floating Return Head</text>
    </g>
  </g>

  <!-- Technical Code Badge -->
  <rect x="620" y="430" width="140" height="30" fill="#10263D" rx="4" />
  <text x="690" y="450" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D88B35" text-anchor="middle">
    ASME / TEMA CLASS R
  </text>
</svg>
