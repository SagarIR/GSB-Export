<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="heroDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10263D" />
      <stop offset="60%" stop-color="#163248" />
      <stop offset="100%" stop-color="#0B1A2A" />
    </linearGradient>
    <linearGradient id="copperLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D88B35" />
      <stop offset="100%" stop-color="#E4A053" />
    </linearGradient>
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#234D70" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#heroDark)" />
  <rect width="1200" height="600" fill="url(#heroGrid)" />

  <!-- Abstract Refinery & Process Heat Transfer Network Graphics -->
  <g opacity="0.35" transform="translate(150, 50)">
    <!-- Distillation Columns -->
    <rect x="100" y="80" width="70" height="380" rx="35" fill="none" stroke="#234D70" stroke-width="2.5" />
    <line x1="100" y1="160" x2="170" y2="160" stroke="#234D70" stroke-width="1.5" />
    <line x1="100" y1="240" x2="170" y2="240" stroke="#234D70" stroke-width="1.5" />
    <line x1="100" y1="320" x2="170" y2="320" stroke="#234D70" stroke-width="1.5" />
    <line x1="100" y1="400" x2="170" y2="400" stroke="#234D70" stroke-width="1.5" />

    <rect x="240" y="140" width="55" height="320" rx="27" fill="none" stroke="#234D70" stroke-width="2" />

    <!-- Heat Exchanger Shells in Piping Loop -->
    <g transform="translate(360, 260)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#10263D" stroke="#D88B35" stroke-width="2" />
      <line x1="30" y1="10" x2="150" y2="10" stroke="#D8DEE5" stroke-width="2" />
      <line x1="30" y1="25" x2="150" y2="25" stroke="#D8DEE5" stroke-width="2" />
      <line x1="30" y1="40" x2="150" y2="40" stroke="#D8DEE5" stroke-width="2" />
      <line x1="30" y1="50" x2="150" y2="50" stroke="#D8DEE5" stroke-width="2" />
    </g>

    <!-- Interconnecting High Pressure Process Lines -->
    <path d="M 170 120 L 360 120 L 360 260" fill="none" stroke="url(#copperLine)" stroke-width="3" />
    <path d="M 540 290 L 680 290 L 680 420 L 295 420" fill="none" stroke="#234D70" stroke-width="3" stroke-dasharray="6 4" />
    
    <!-- Secondary Exchanger Battery -->
    <g transform="translate(620, 160)">
      <rect x="0" y="0" width="160" height="50" rx="8" fill="#10263D" stroke="#234D70" stroke-width="2" />
      <circle cx="25" cy="25" r="14" fill="#D88B35" opacity="0.8" />
      <circle cx="135" cy="25" r="14" fill="#234D70" />
    </g>
  </g>

  <!-- Flow Particle Nodes -->
  <circle cx="480" cy="170" r="4" fill="#D88B35" />
  <circle cx="510" cy="170" r="3" fill="#D88B35" opacity="0.6" />
  <circle cx="710" cy="310" r="5" fill="#D8DEE5" />
</svg>

