<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#10263D" />
  <g transform="translate(60, 40)">
    <!-- WFI Pure Steam & Water Loop Circuit -->
    <circle cx="200" cy="160" r="110" fill="none" stroke="#234D70" stroke-width="3" stroke-dasharray="8 6" />
    
    <!-- Double Tubesheet (DTS) Sanitary Heat Exchanger -->
    <rect x="130" y="130" width="140" height="60" rx="8" fill="#163248" stroke="#D8DEE5" stroke-width="2" />
    <!-- Double Tubesheet Gap Indicator -->
    <line x1="150" y1="125" x2="150" y2="195" stroke="#D88B35" stroke-width="2" />
    <line x1="155" y1="125" x2="155" y2="195" stroke="#D88B35" stroke-width="2" />
    <line x1="245" y1="125" x2="245" y2="195" stroke="#D88B35" stroke-width="2" />
    <line x1="250" y1="125" x2="250" y2="195" stroke="#D88B35" stroke-width="2" />

    <!-- Pure Water Flow Line -->
    <path d="M 60 160 L 130 160" stroke="#D8DEE5" stroke-width="3" />
    <path d="M 270 160 L 350 160" stroke="#D8DEE5" stroke-width="3" />
    
    <!-- Clean utility indicator badge -->
    <circle cx="200" cy="80" r="16" fill="#D88B35" />
    <text x="200" y="85" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#10263D" text-anchor="middle">WFI</text>
  </g>
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Pharmaceutical &amp; Biotechnology</text>
  <text x="50" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#D88B35">Double-Tubesheet Cross-Contamination Prevention</text>
</svg>
