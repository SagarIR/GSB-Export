<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="spBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234D70" />
      <stop offset="50%" stop-color="#10263D" />
      <stop offset="100%" stop-color="#0B1A2A" />
    </linearGradient>
    <pattern id="spGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8DEE5" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Engineering Background -->
  <rect width="800" height="500" fill="#F3F5F7" />
  <rect width="800" height="500" fill="url(#spGrid)" />

  <rect x="20" y="20" width="760" height="460" stroke="#D8DEE5" stroke-width="1.5" rx="6" />
  <text x="40" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10263D" letter-spacing="1.5">
    SPIRAL HEAT EXCHANGER (SHE) SCHEMATIC
  </text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#234D70">
    Self-Cleaning Single Concentric Curved Channel for Heavy Slurries &amp; Sludges
  </text>

  <!-- Spiral Exchanger Cross Section Assembly -->
  <g transform="translate(180, 80)">
    <!-- Outer Cylindrical Shell Flange -->
    <circle cx="220" cy="170" r="150" fill="url(#spBodyGrad)" stroke="#10263D" stroke-width="3" />
    <circle cx="220" cy="170" r="142" fill="#0E1E2E" stroke="#234D70" stroke-width="2" />

    <!-- Two Concentric Spiraling Channels -->
    <!-- Channel A (Hot/Slurry Stream - Copper) -->
    <path d="M 220 170 
             A 15 15 0 0 1 235 170 
             A 30 30 0 0 1 205 170 
             A 45 45 0 0 1 250 170 
             A 60 60 0 0 1 190 170 
             A 75 75 0 0 1 265 170 
             A 90 90 0 0 1 175 170 
             A 105 105 0 0 1 280 170 
             A 120 120 0 0 1 160 170 
             A 135 135 0 0 1 295 170" 
          fill="none" stroke="#D88B35" stroke-width="6" stroke-linecap="round" />

    <!-- Channel B (Cold Stream - Steel/Silver) -->
    <path d="M 220 170 
             A 22 22 0 0 0 220 192 
             A 37 37 0 0 0 220 148 
             A 52 52 0 0 0 220 207 
             A 67 67 0 0 0 220 133 
             A 82 82 0 0 0 220 222 
             A 97 97 0 0 0 220 118 
             A 112 112 0 0 0 220 237 
             A 127 127 0 0 0 220 103" 
          fill="none" stroke="#D8DEE5" stroke-width="5" stroke-linecap="round" />

    <!-- Central Core Divider Column -->
    <circle cx="220" cy="170" r="12" fill="#10263D" stroke="#D88B35" stroke-width="2" />

    <!-- Nozzles -->
    <!-- Peripheral Tangential Inlets -->
    <!-- Slurry Peripheral Inlet (Top Right) -->
    <rect x="295" y="30" width="30" height="35" fill="#234D70" stroke="#10263D" stroke-width="1.5" />
    <rect x="285" y="24" width="50" height="7" fill="#10263D" rx="2" />
    <path d="M 310 10 L 310 22 M 305 17 L 310 22 L 315 17" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="345" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">SLURRY INLET</text>

    <!-- Central Core Outlet (Facing Viewer) -->
    <circle cx="220" cy="170" r="5" fill="#D88B35" />
    <text x="235" y="174" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">CORE DISCHARGE</text>

    <!-- Support Saddle Base -->
    <path d="M 120 290 L 100 350 L 140 350 L 150 300 Z" fill="#202A35" />
    <path d="M 320 290 L 300 350 L 340 350 L 330 300 Z" fill="#202A35" />
    <rect x="80" y="345" width="280" height="10" fill="#10263D" rx="2" />
  </g>

  <!-- Technical Annotations Footer -->
  <g transform="translate(100, 440)">
    <circle cx="10" cy="10" r="4" fill="#D88B35" />
    <text x="22" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Single Continuous Curved Channel</text>
    
    <circle cx="260" cy="10" r="4" fill="#D8DEE5" />
    <text x="272" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Self-Scrubbing Anti-Fouling Effect</text>
  </g>

  <rect x="620" y="430" width="140" height="30" fill="#10263D" rx="4" />
  <text x="690" y="450" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D88B35" text-anchor="middle">
    ASME SEC VIII / EN 13445
  </text>
</svg>

