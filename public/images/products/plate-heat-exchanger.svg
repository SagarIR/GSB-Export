<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="pheFrameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234D70" />
      <stop offset="50%" stop-color="#10263D" />
      <stop offset="100%" stop-color="#0B1A2A" />
    </linearGradient>
    <linearGradient id="phePlateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8DEE5" />
      <stop offset="50%" stop-color="#F3F5F7" />
      <stop offset="100%" stop-color="#BDC7D2" />
    </linearGradient>
    <pattern id="pheGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D8DEE5" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Engineering Background -->
  <rect width="800" height="500" fill="#F3F5F7" />
  <rect width="800" height="500" fill="url(#pheGrid)" />

  <!-- Technical Border Frame -->
  <rect x="20" y="20" width="760" height="460" stroke="#D8DEE5" stroke-width="1.5" rx="6" />
  <text x="40" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10263D" letter-spacing="1.5">
    GASKETED / SEMI-WELDED PLATE HEAT EXCHANGER (PHE)
  </text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#234D70">
    Corrugated Plate Pack with Counter-Current Thermal Transfer Geometry
  </text>

  <!-- Plate Exchanger Assembly -->
  <g transform="translate(140, 90)">
    <!-- Top Carrying Bar (Beam) -->
    <rect x="40" y="20" width="460" height="16" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="3" />
    <!-- Bottom Guide Bar -->
    <rect x="40" y="280" width="460" height="14" fill="#202A35" stroke="#10263D" stroke-width="1.5" rx="3" />

    <!-- Fixed Frame Plate (Front / Left Heavy Steel Plate) -->
    <rect x="50" y="0" width="36" height="315" fill="url(#pheFrameGrad)" stroke="#10263D" stroke-width="2" rx="4" />
    <!-- Front Support Foot -->
    <path d="M 40 315 L 96 315 L 105 340 L 30 340 Z" fill="#10263D" />

    <!-- Four Port Flanges on Fixed Frame -->
    <!-- Top Left Port (Hot In) -->
    <circle cx="68" cy="65" r="18" fill="#D88B35" stroke="#10263D" stroke-width="2" />
    <circle cx="68" cy="65" r="9" fill="#0E1E2E" />
    <path d="M 68 30 L 68 45 M 63 38 L 68 45 L 73 38" stroke="#D88B35" stroke-width="2.5" stroke-linecap="round" />
    <text x="-10" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#D88B35">HOT IN</text>

    <!-- Bottom Left Port (Cold In) -->
    <circle cx="68" cy="245" r="18" fill="#234D70" stroke="#10263D" stroke-width="2" />
    <circle cx="68" cy="245" r="9" fill="#0E1E2E" />
    <path d="M 68 280 L 68 265 M 63 272 L 68 265 L 73 272" stroke="#234D70" stroke-width="2.5" stroke-linecap="round" />
    <text x="-15" y="248" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#234D70">COLD IN</text>

    <!-- Corrugated Plate Pack (Thin Metallic Heat Transfer Plates) -->
    <g transform="translate(86, 28)">
      <!-- Repeating Plate Strips with Chevron Pattern Lines -->
      <g stroke="#10263D" stroke-width="0.8">
        <!-- Render stack of plates -->
        <rect x="0" y="0" width="280" height="260" fill="url(#phePlateGrad)" stroke="#234D70" stroke-width="1.5" />
        
        <!-- Plate Corrugation Chevron Grooves -->
        <path d="M 10 20 L 270 20 M 10 40 L 270 40 M 10 60 L 270 60 M 10 80 L 270 80 M 10 100 L 270 100 M 10 120 L 270 120 M 10 140 L 270 140 M 10 160 L 270 160 M 10 180 L 270 180 M 10 200 L 270 200 M 10 220 L 270 220 M 10 240 L 270 240" stroke="#BDC7D2" stroke-width="1.5" />
        
        <!-- Individual Vertical Gasket / Plate Lines -->
        <line x1="20" y1="0" x2="20" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="40" y1="0" x2="40" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="60" y1="0" x2="60" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="80" y1="0" x2="80" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="100" y1="0" x2="100" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="120" y1="0" x2="120" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="140" y1="0" x2="140" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="160" y1="0" x2="160" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="180" y1="0" x2="180" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="200" y1="0" x2="200" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="220" y1="0" x2="220" y2="260" stroke="#10263D" stroke-width="1.5" />
        <line x1="240" y1="0" x2="240" y2="260" stroke="#D88B35" stroke-width="1.5" />
        <line x1="260" y1="0" x2="260" y2="260" stroke="#10263D" stroke-width="1.5" />
      </g>
    </g>

    <!-- Movable Pressure Plate (Follower Plate) -->
    <rect x="366" y="0" width="30" height="315" fill="url(#pheFrameGrad)" stroke="#10263D" stroke-width="2" rx="4" />

    <!-- Rear Support Column -->
    <rect x="470" y="10" width="24" height="305" fill="#202A35" stroke="#10263D" stroke-width="2" rx="2" />
    <path d="M 455 315 L 505 315 L 515 340 L 445 340 Z" fill="#10263D" />

    <!-- Tightening Tie Bolts with Nuts -->
    <!-- Top Tie Bolt -->
    <rect x="25" y="45" width="465" height="8" fill="#BDC7D2" stroke="#202A35" stroke-width="1" rx="2" />
    <rect x="18" y="41" width="10" height="16" fill="#D88B35" rx="2" />
    <rect x="390" y="41" width="12" height="16" fill="#D88B35" rx="2" />
    
    <!-- Middle Tie Bolt -->
    <rect x="25" y="155" width="465" height="8" fill="#BDC7D2" stroke="#202A35" stroke-width="1" rx="2" />
    <rect x="18" y="151" width="10" height="16" fill="#D88B35" rx="2" />
    <rect x="390" y="151" width="12" height="16" fill="#D88B35" rx="2" />

    <!-- Bottom Tie Bolt -->
    <rect x="25" y="260" width="465" height="8" fill="#BDC7D2" stroke="#202A35" stroke-width="1" rx="2" />
    <rect x="18" y="256" width="10" height="16" fill="#D88B35" rx="2" />
    <rect x="390" y="256" width="12" height="16" fill="#D88B35" rx="2" />
  </g>

  <!-- Technical Annotations Footer -->
  <g transform="translate(100, 440)">
    <circle cx="10" cy="10" r="4" fill="#D88B35" />
    <text x="22" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Fixed Frame &amp; Nozzles</text>
    
    <circle cx="180" cy="10" r="4" fill="#234D70" />
    <text x="192" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Corrugated Stainless/Titanium Plates</text>
    
    <circle cx="440" cy="10" r="4" fill="#10263D" />
    <text x="452" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10263D">Compression Tie Bolts</text>
  </g>

  <rect x="620" y="430" width="140" height="30" fill="#10263D" rx="4" />
  <text x="690" y="450" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D88B35" text-anchor="middle">
    API 662 / ASME SEC VIII
  </text>
</svg>

